<div id="timeline">
  <h2>Timeline of the Internet in India</h2>
  <ul>
    {{#each timeline}}
      <li>
        <strong>{{year}}</strong>: {{description}}
        <ul>
          <li>{{p1}}</li>
          <li>{{p2}}</li>
          <li>{{p3}}</li>
        </ul>
      </li>
    {{/each}}
  </ul>
</div>
